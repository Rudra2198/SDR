name: CI

# Customer 01 from the architecture: "is this safe to merge?"
# Runs on every PR and on pushes to main. The eval gate runs zero cases today and
# passes; it grows teeth as evals are registered phase by phase (playbook Part 6).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruvu
          POSTGRES_PASSWORD: ruvu
          POSTGRES_DB: ruvu_sdr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruvu -d ruvu_sdr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ruvu:ruvu@localhost:5432/ruvu_sdr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Run migrations
        run: uv run python scripts/run_migrations.py

      - name: Tests (pytest)
        run: uv run pytest

      - name: Eval gate (Customer 01 — safe to merge)
        run: uv run python -m ruvu_sdr.evals.runner --suite pr
